<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNF Stats - 70.3 Santa Cruz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
<style>
  :root {
    --bg:        #0E2438;
    --panel:     #16324A;
    --panel-2:   #1C3D59;
    --line:      #2C4F6B;
    --text:      #E8F1F2;
    --muted:     #8FAAB8;
    --teal:      #2EC4B6;
    --coral:     #EF6461;
    --sand:      #F2C14E;
    --font-display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--sand);
    text-transform: uppercase;
    margin: 0 0 6px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 4px;
    line-height: 1.05;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 18px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .control-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .bib-pills {
    display: flex;
    gap: 8px;
  }

  .bib-pill {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 3px;
    border: 1.5px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .bib-pill:hover { border-color: var(--teal); color: var(--text); }

  .bib-pill.active {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--bg);
  }

  .back-link {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--sand);
    cursor: pointer;
    text-decoration: none;
    text-transform: uppercase;
    display: none;
    align-items: center;
    gap: 6px;
  }
  .back-link.visible { display: inline-flex; }
  .back-link:hover { color: var(--text); }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  .scene-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
  }

  .scene-desc {
    color: var(--muted);
    font-size: 14px;
    max-width: 640px;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  svg { overflow: visible; }

  .stage-label {
    font-family: var(--font-mono);
    font-size: 12px;
    fill: var(--muted);
  }

  .stage-count {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    fill: var(--text);
  }

  .funnel-bar { fill: var(--teal); }
  .dnf-bar { fill: var(--coral); }
  .drop-note {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: var(--coral);
  }

  .axis text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
  .axis path, .axis line { stroke: var(--line); }
  .axis .domain { stroke: var(--line); }
  .gridline { stroke: var(--line); stroke-dasharray: 2,3; }

  .annotation-note-label,
  .annotation-note-title {
    font-family: var(--font-mono) !important;
    fill: var(--sand) !important;
  }
  .annotation-note-title { font-weight: 700; }
  .annotation-connector, .annotation-subject { stroke: var(--sand); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 40px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }

  .card:hover {
    border-color: var(--teal);
    transform: translateY(-2px);
  }

  .card-marker {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--sand);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .card-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--panel-2);
    border: 1px solid var(--teal);
    border-radius: 4px;
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    opacity: 0;
    transition: opacity 0.1s ease;
    z-index: 20;
  }

  .caption {
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
    font-family: var(--font-mono);
    max-width: 640px;
    line-height: 1.6;
  }

  .legend {
    display: flex;
    gap: 18px;
    margin-bottom: 18px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }
  .legend-swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Ironman 70.3 Santa Cruz &middot; 2023&ndash;2025</p>
  <h1>DNF (Did Not Finish) Stats — IRONMAN 70.3 Santa Cruz</h1>
  <p class="subtitle">Investigating risk of getting pulled from the race.</p>
  <div class="controls">
    <span class="control-label">Year</span>
    <div class="bib-pills" id="year-pills"></div>
    <a class="back-link" id="back-link">&larr; Back to overview</a>
  </div>
</header>

<main>
  <div id="scene-title" class="scene-title"></div>
  <div id="scene-desc" class="scene-desc"></div>
  <div id="scene"></div>
</main>

<div class="tooltip" id="tooltip"></div>

<script>
const state = {
  scene: 'overview', 
  year: 'all'
};

let DATA = null;
const tooltip = d3.select('#tooltip');

const YEARS = ['all', 2023, 2024, 2025];

// boot
d3.json('narrative_data.json').then(data => {
  DATA = data;
  buildYearPills();
  render();
});

function buildYearPills() {
  const pills = d3.select('#year-pills')
    .selectAll('.bib-pill')
    .data(YEARS)
    .join('div')
    .attr('class', 'bib-pill')
    .text(d => d === 'all' ? 'ALL' : d)
    .on('click', (event, d) => {
      state.year = d;
      buildYearPills();
      render();
    });
  pills.classed('active', d => d === state.year);
}

d3.select('#back-link').on('click', () => {
  state.scene = 'overview';
  render();
});

// Router
function render() {
  d3.select('#back-link').classed('visible', state.scene !== 'overview');
  const sceneEl = d3.select('#scene').html('');

  if (state.scene === 'overview') renderOverview(sceneEl);
  else if (state.scene === 'discipline') renderDiscipline(sceneEl);
  else if (state.scene === 'division') renderDivision(sceneEl);
  else if (state.scene === 'pacing') renderPacing(sceneEl);
}

function goTo(scene) {
  state.scene = scene;
  render();
}

// Scene 0 - Overview / Funnel 
function renderOverview(root) {
  d3.select('#scene-title').text('The Funnel');
  d3.select('#scene-desc').text(
    'An overview of each stage throughout the race as a whole.'
  );

  const f = DATA.funnel[String(state.year)];
  const stages = [
    { key: 'starters', label: 'STARTERS', value: f.starters },
    { key: 'completed_swim', label: 'COMPLETED SWIM', value: f.completed_swim },
    { key: 'completed_bike', label: 'COMPLETED BIKE', value: f.completed_bike },
    { key: 'completed_run', label: 'COMPLETED RUN', value: f.completed_run },
    { key: 'official_finish', label: 'OFFICIAL FINISH', value: f.official_finish }
  ];

  const width = 600, barH = 46, gap = 30;
  const height = stages.length * (barH + gap);
  const maxVal = stages[0].value;
  const x = d3.scaleLinear().domain([0, maxVal]).range([0, width]);

  const svg = root.append('svg').attr('width', width).attr('height', height + 20);

  const rows = svg.selectAll('.stage-row')
    .data(stages)
    .join('g')
    .attr('class', 'stage-row')
    .attr('transform', (d, i) => `translate(0, ${i * (barH + gap)})`);

  rows.append('rect')
    .attr('class', 'funnel-bar')
    .attr('x', 0).attr('y', 0)
    .attr('height', barH)
    .attr('width', 0)
    .attr('rx', 3)
    .transition().duration(500)
    .attr('width', d => x(d.value));

  rows.append('text')
    .attr('class', 'stage-label')
    .attr('x', 0).attr('y', -8)
    .text(d => d.label);

  rows.append('text')
    .attr('class', 'stage-count')
    .attr('x', d => x(d.value) + 12)
    .attr('y', barH / 2 + 6)
    .text(d => d.value.toLocaleString());

  // drop-off numbers
  for (let i = 1; i < stages.length; i++) {
    const prev = stages[i - 1], cur = stages[i];
    const dropped = prev.value - cur.value;
    if (dropped <= 0) continue;
    svg.append('text')
      .attr('class', 'drop-note')
      .attr('x', x(cur.value) + 12)
      .attr('y', (i - 1) * (barH + gap) + barH + gap / 2 + 4)
      .text(`\u2212${dropped.toLocaleString()} DNF or disqualified`);
  }

  // drill-down cards
  const cards = root.append('div').attr('class', 'cards');

  const cardData = [
    { scene: 'discipline', marker: 'DNFs By Discipline', desc: 'Take a closer look at DNFs side by side, by discipline.' },
    { scene: 'division', marker: 'DNFs By Group', desc: 'DNF rate by group (age & sex).' },
    { scene: 'pacing', marker: 'Finish Times', desc: 'Distribution of finish times.' }
  ];

  cards.selectAll('.card')
    .data(cardData)
    .join('div')
    .attr('class', 'card')
    .on('click', (event, d) => goTo(d.scene))
    .html(d => `  
      <div class="card-marker">${d.marker}</div>
      <div class="card-desc">${d.desc}</div>
    `);

}

// Scene 1 - DNF side by side by stage
function renderDiscipline(root) {
  d3.select('#scene-title').text('DNF side by side by stage');

  const d = DATA.discipline_dnf[String(state.year)];
  const stages = [
    { key: 'DNF - Swim', label: 'DNF on Swim' },
    { key: 'DNF - Bike', label: 'DNF on Bike' },
    { key: 'DNF - Run', label: 'DNF on Run' }
  ].map(s => ({ ...s, value: d[s.key] }));

  const width = 700, height = 320, margin = { top: 10, right: 20, bottom: 70, left: 50 };
  const svg = root.append('svg').attr('width', width).attr('height', height);

  const x = d3.scaleBand().domain(stages.map(s => s.label)).range([margin.left, width - margin.right]).padding(0.35);
  const y = d3.scaleLinear().domain([0, d3.max(stages, s => s.value)]).nice().range([height - margin.bottom, margin.top]);

  svg.append('g')
    .attr('class', 'axis')
    .attr('transform', `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x))
    .selectAll('text')
    .call(wrapText, x.bandwidth());

  svg.append('g')
    .attr('class', 'axis')
    .attr('transform', `translate(${margin.left},0)`)
    .call(d3.axisLeft(y).ticks(5));

  svg.selectAll('.bar')
    .data(stages)
    .join('rect')
    .attr('class', 'dnf-bar')
    .attr('x', s => x(s.label))
    .attr('width', x.bandwidth())
    .attr('y', height - margin.bottom)
    .attr('height', 0)
    .transition().duration(500)
    .attr('y', s => y(s.value))
    .attr('height', s => (height - margin.bottom) - y(s.value));

  svg.selectAll('.bar-label')
    .data(stages)
    .join('text')
    .attr('class', 'stage-count')
    .attr('x', s => x(s.label) + x.bandwidth() / 2)
    .attr('y', s => y(s.value) - 10)
    .attr('text-anchor', 'middle')
    .style('font-size', '16px')
    .text(s => s.value);

}

// Scene Two - Age / Sex
function renderDivision(root) {
  d3.select('#scene-title').text('DNF By Group');
  d3.select('#scene-desc').text(
    ''
  );

  const yearData = DATA.division_dnf[String(state.year)];
  if (!yearData) {
    root.append('p').attr('class', 'caption')
      .style('color', 'var(--coral)')
      .text(`No division data found for "${state.year}". Expected DATA.division_dnf to have a key for this year — check that narrative_data.json is the latest version (it should have keys: ${Object.keys(DATA.division_dnf).join(', ')}).`);
    return;
  }

  let divs = yearData.filter(d => d.starters >= 15);
  divs = divs.slice(0, 15);

  const width = 700, height = divs.length * 28 + 40, margin = { top: 10, right: 60, bottom: 10, left: 90 };
  const svg = root.append('svg').attr('width', width).attr('height', height);

  const y = d3.scaleBand().domain(divs.map(d => d.division)).range([margin.top, height - margin.bottom]).padding(0.25);
  const x = d3.scaleLinear().domain([0, d3.max(divs, d => d.dnf_rate)]).nice().range([margin.left, width - margin.right]);

  svg.selectAll('.division-label')
    .data(divs)
    .join('text')
    .attr('class', 'stage-label')
    .attr('x', margin.left - 10)
    .attr('y', d => y(d.division) + y.bandwidth() / 2 + 4)
    .attr('text-anchor', 'end')
    .text(d => d.division);

  svg.selectAll('.bar')
    .data(divs)
    .join('rect')
    .attr('class', 'dnf-bar')
    .attr('x', margin.left)
    .attr('y', d => y(d.division))
    .attr('height', y.bandwidth())
    .attr('width', 0)
    .on('mouseover', (event, d) => {
      tooltip.style('opacity', 1)
        .html(`<b>${d.division}</b><br>${d.dnf_count} DNF / ${d.starters} starters`);
    })
    .on('mousemove', event => {
      tooltip.style('left', (event.pageX + 14) + 'px').style('top', (event.pageY - 20) + 'px');
    })
    .on('mouseout', () => tooltip.style('opacity', 0))
    .transition().duration(500)
    .attr('width', d => x(d.dnf_rate) - margin.left);

  svg.selectAll('.rate-label')
    .data(divs)
    .join('text')
    .attr('class', 'stage-label')
    .attr('x', d => x(d.dnf_rate) + 8)
    .attr('y', d => y(d.division) + y.bandwidth() / 2 + 4)
    .text(d => (d.dnf_rate * 100).toFixed(1) + '%');

  const top = divs[0];
  const annotations = [{
    note: { label: `${top.dnf_count} of ${top.starters} starters`, title: `Highest DNF rate: ${top.division}` },
    x: x(top.dnf_rate),
    y: y(top.division) + y.bandwidth() / 2,
    dx: 60, dy: -30,
    type: d3.annotationCalloutElbow
  }];
  svg.append('g').call(d3.annotation().annotations(annotations));

  root.append('p').attr('class', 'caption')
    .text(`Showing top ${divs.length} divisions by DNF rate (min. 15 starters) for ${state.year === 'all' ? '2023\u201325 combined' : state.year}.`);
}

// Scene 3 finish times
function renderPacing(root) {
  d3.select('#scene-title').text('Finish Times');

  const cutoff = DATA.pacing.cutoff_minutes;
  let times = DATA.pacing.times;
  if (state.year !== 'all') {
    times = times.filter(t => t.Year === +state.year);
  }

  const width = 760, height = 360, margin = { top: 20, right: 30, bottom: 40, left: 50 };
  const svg = root.append('svg').attr('width', width).attr('height', height);

  const x = d3.scaleLinear().domain(d3.extent(times, d => d.overall_min)).nice().range([margin.left, width - margin.right]);

  // histogram bins
  const bins = d3.bin().domain(x.domain()).thresholds(40)(times.map(t => t.overall_min));
  const y = d3.scaleLinear().domain([0, d3.max(bins, b => b.length)]).nice().range([height - margin.bottom, margin.top]);

  svg.append('g')
    .attr('class', 'axis')
    .attr('transform', `translate(0,${height - margin.bottom})`)
    .call(d3.axisBottom(x).ticks(8).tickFormat(d => (d / 60).toFixed(1) + 'h'));

  svg.append('g')
    .attr('class', 'axis')
    .attr('transform', `translate(${margin.left},0)`)
    .call(d3.axisLeft(y).ticks(5));

  svg.selectAll('.bin')
    .data(bins)
    .join('rect')
    .attr('class', 'funnel-bar')
    .attr('x', b => x(b.x0) + 1)
    .attr('width', b => Math.max(0, x(b.x1) - x(b.x0) - 1))
    .attr('y', height - margin.bottom)
    .attr('height', 0)
    .transition().duration(500)
    .attr('y', b => y(b.length))
    .attr('height', b => (height - margin.bottom) - y(b.length));

  // cutoff line
  svg.append('line')
    .attr('x1', x(cutoff)).attr('x2', x(cutoff))
    .attr('y1', margin.top).attr('y2', height - margin.bottom)
    .attr('stroke', 'var(--coral)')
    .attr('stroke-width', 2)
    .attr('stroke-dasharray', '5,4');

  const closeCount = times.filter(t => t.overall_min >= cutoff - 30).length;

  const annotations = [{
    note: {title: '8:30:00 course cutoff' },
    x: x(cutoff), y: margin.top + 10,
    dx: 50, dy: 20,
    type: d3.annotationCalloutElbow
  }];
  svg.append('g').call(d3.annotation().annotations(annotations));

}

// helper function
function wrapText(selection, width) {
  selection.each(function () {
    const text = d3.select(this);
    const words = text.text().split('\n');
    text.text(null);
    words.forEach((w, i) => {
      text.append('tspan')
        .attr('x', 0)
        .attr('dy', i === 0 ? '0.9em' : '1.1em')
        .text(w);
    });
  });
}
</script>

</body>
</html>
